services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: api
    networks:
      - backend

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: worker
    volumes:
      - ./scripts:/scripts
    networks:
      - backend

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - backend

  ingestor:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ingestor
    command: ["python", "-u", "ingestor.py"]
    networks:
      - backend

  indicator_worker_0:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: indicator_worker
      WORKER_INDEX: "0"
      N_WORKERS: "2"
    command: ["python", "-u", "indicator_worker.py"]
    networks:
      - backend

  indicator_worker_1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: indicator_worker
      WORKER_INDEX: "1"
      N_WORKERS: "2"
    command: ["python", "-u", "indicator_worker.py"]
    networks:
      - backend

  signal_worker_0:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: signal_worker
      WORKER_INDEX: "0"
      N_WORKERS: "2"
    command: ["python", "-u", "signal_worker.py"]
    networks:
      - backend

  signal_worker_1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: signal_worker
      WORKER_INDEX: "1"
      N_WORKERS: "2"
    command: ["python", "-u", "signal_worker.py"]
    networks:
      - backend

  unicorn_pipeline:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: unicorn_pipeline
      UNICORN_PIPELINE_INTERVAL_S: "300"
    command: ["python", "-u", "unicorn_pipeline.py"]
    networks:
      - backend

  ohlcv_persister:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ohlcv_persister
    command: ["python", "-u", "ohlcv_persister.py"]
    networks:
      - backend

  social_collector:
    build:
      context: ./social_collector
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: social_collector
    volumes:
      - ./social_collector/app:/app
      - social_telegram_sessions:/app/sessions
    networks:
      - backend

  derivatives_collector:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: derivatives_collector
      COLLECTION_INTERVAL_S: "3600"
      FUNDING_INTERVAL_S: "14400"
    command: ["python", "-u", "/scripts/derivatives_collector.py"]
    volumes:
      - ./scripts:/scripts
    networks:
      - backend

  onchain_collector:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: onchain_collector
      ONCHAIN_COLLECTION_INTERVAL_S: "3600"
      DUNE_API_KEY: ${DUNE_API_KEY:-}
    command: ["python", "-u", "/scripts/onchain_collector.py"]
    volumes:
      - ./scripts:/scripts
    networks:
      - backend

  cpu_collector:
    image: python:3.12-slim
    container_name: mcas-cpu-collector
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./monitoring/cpu_collector.py:/app/cpu_collector.py:ro
      - ./monitoring/cpu_query.py:/app/cpu_query.py:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CPU_SAMPLE_INTERVAL=5
      - CPU_HISTORY_TTL=86400
      - CPU_DOCKER_STATS=true
      - CPU_ALERT_THRESHOLD=85
      - CPU_ALERT_SUSTAINED=30
      - HOST_PROC=/host/proc
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install --quiet redis && python cpu_collector.py"]
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  social_telegram_sessions:

networks:
  backend:
