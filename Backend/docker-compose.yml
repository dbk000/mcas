# MCAS — 8-container consolidated topology
# Replaces the previous 22-service layout.
# See docker-consolidation-plan.md for the rationale and migration details.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile  # third-party image config
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: api
    mem_limit: 512m
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/HC_Volume_104727149/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/PG_VERSION || exit 1"]
      interval: 10s
      retries: 3
      start_period: 30s
    mem_limit: 4g
    networks:
      - backend

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - backend

  collectors:
    build:
      context: .
      dockerfile: Dockerfile.collectors
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: collectors
      COLLECTION_INTERVAL_S: "3600"
      FUNDING_INTERVAL_S: "14400"
      ONCHAIN_COLLECTION_INTERVAL_S: "3600"
      DUNE_API_KEY: ${DUNE_API_KEY:-}
      CPU_SAMPLE_INTERVAL: "5"
      CPU_HISTORY_TTL: "86400"
      CPU_DOCKER_STATS: "true"
      CPU_ALERT_THRESHOLD: "85"
      CPU_ALERT_SUSTAINED: "30"
      HOST_PROC: /host/proc
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TELEGRAM_SESSION_PATH: /backend/social_collector/sessions/mcas
    volumes:
      - social_telegram_sessions:/backend/social_collector/sessions  # persistent state only
      - /proc:/host/proc:ro          # host system — cpu_collector
      - /var/run/docker.sock:/var/run/docker.sock:ro  # host system — cpu_collector
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  computers:
    build:
      context: .
      dockerfile: Dockerfile.computers
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: computers
      N_WORKERS: "2"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      retries: 3
      start_period: 60s
    mem_limit: 6g
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  strats_evals:
    build:
      context: .
      dockerfile: Dockerfile.strats_evals
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: strats_evals
      D2_ENTRY_THRESHOLD: "0.25"
      D2_STOP_PCT: "0.15"
      D2_TIME_STOP_HOURS: "72"
      D2_MAX_WATCH_HOURS: "48"
      D2_MANIA_GATE_PCT: "40.0"
      D2_LIQUIDITY_GATE_USD: "1000000"
      D2_CANDLE_INTERVAL: "1m"
      D2_POLL_INTERVAL_S: "60"
      D2_CLUSTER_POLL_S: "30"
      D2_MAX_CONCURRENT: "3"
      D2_FNG_SOFT_GATE: "log_only"
      UNICORN_PIPELINE_INTERVAL_S: "300"
      SETTLER_INTERVAL_S: "3600"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      retries: 3
      start_period: 60s
    cpus: "2.0"
    mem_limit: 6g
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  strats_features:
    build:
      context: .
      dockerfile: Dockerfile.strats_features
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: custom_strategy_worker
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: "1.0"
    depends_on:
      - postgres
      - redis
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:
  social_telegram_sessions:

networks:
  backend:
