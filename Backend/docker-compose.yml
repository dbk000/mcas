services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: api
    mem_limit: 512m
    networks:
      - backend

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: worker
    volumes:
      - ./scripts:/scripts
    mem_limit: 8g
    networks:
      - backend

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/HC_Volume_104727149/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/PG_VERSION || exit 1"]
      interval: 10s
      retries: 3
      start_period: 30s
    mem_limit: 4g
    networks:
      - backend

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - backend

  ingestor:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ingestor
    command: ["python", "-u", "ingestor.py"]
    mem_limit: 512m
    networks:
      - backend

  indicator_worker_0:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: indicator_worker
      WORKER_INDEX: "0"
      N_WORKERS: "2"
    command: ["python", "-u", "indicator_worker.py"]
    mem_limit: 1g
    networks:
      - backend

  indicator_worker_1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: indicator_worker
      WORKER_INDEX: "1"
      N_WORKERS: "2"
    command: ["python", "-u", "indicator_worker.py"]
    mem_limit: 1g
    networks:
      - backend

  signal_worker_0:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: signal_worker
      WORKER_INDEX: "0"
      N_WORKERS: "2"
    command: ["python", "-u", "signal_worker.py"]
    mem_limit: 512m
    networks:
      - backend

  signal_worker_1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: signal_worker
      WORKER_INDEX: "1"
      N_WORKERS: "2"
    command: ["python", "-u", "signal_worker.py"]
    mem_limit: 512m
    networks:
      - backend

  unicorn_pipeline:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: unicorn_pipeline
      UNICORN_PIPELINE_INTERVAL_S: "300"
    command: ["python", "-u", "unicorn_pipeline.py"]
    mem_limit: 512m
    networks:
      - backend

  ohlcv_persister:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: ohlcv_persister
    command: ["python", "-u", "ohlcv_persister.py"]
    mem_limit: 256m
    networks:
      - backend

  social_collector:
    build:
      context: ./social_collector
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: social_collector
    volumes:
      - ./social_collector/app:/app
      - social_telegram_sessions:/app/sessions
    mem_limit: 512m
    networks:
      - backend

  derivatives_collector:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: derivatives_collector
      COLLECTION_INTERVAL_S: "3600"
      FUNDING_INTERVAL_S: "14400"
    command: ["python", "-u", "/scripts/derivatives_collector.py"]
    volumes:
      - ./scripts:/scripts
    mem_limit: 512m
    networks:
      - backend

  onchain_collector:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: onchain_collector
      ONCHAIN_COLLECTION_INTERVAL_S: "3600"
      DUNE_API_KEY: ${DUNE_API_KEY:-}
    command: ["python", "-u", "/scripts/onchain_collector.py"]
    volumes:
      - ./scripts:/scripts
    mem_limit: 1g
    networks:
      - backend

  cpu_collector:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: mcas-cpu-collector
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./monitoring/cpu_collector.py:/app/cpu_collector.py:ro
      - ./monitoring/cpu_query.py:/app/cpu_query.py:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CPU_SAMPLE_INTERVAL=5
      - CPU_HISTORY_TTL=86400
      - CPU_DOCKER_STATS=true
      - CPU_ALERT_THRESHOLD=85
      - CPU_ALERT_SUSTAINED=30
      - HOST_PROC=/host/proc
    command: ["python", "-u", "cpu_collector.py"]
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M
    networks:
      - backend

  equities_pipeline:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: equities_pipeline
    command: ["python", "-u", "/scripts/equities_pipeline_runner.py", "--loop", "--interval-seconds", "600"]
    volumes:
      - ./scripts:/scripts
    cpus: "2.0"
    mem_limit: 6g
    networks:
      - backend

  equities_strategy_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: equities_strategy_worker
    command: ["python", "-u", "/app/equities_strategy_worker.py"]
    volumes:
      - ./scripts:/scripts
    mem_limit: 1g
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  equities_task_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: equities_task_worker
    command: ["python", "-u", "/scripts/equities_task_worker_loop.py"]
    volumes:
      - ./scripts:/scripts
    mem_limit: 1g
    networks:
      - backend

  d2_paper_trader:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: d2_paper_trader
      D2_ENTRY_THRESHOLD: "0.25"
      D2_STOP_PCT: "0.15"
      D2_TIME_STOP_HOURS: "72"
      D2_MAX_WATCH_HOURS: "48"
      D2_MANIA_GATE_PCT: "40.0"
      D2_LIQUIDITY_GATE_USD: "1000000"
      D2_CANDLE_INTERVAL: "1m"
      D2_POLL_INTERVAL_S: "60"
      D2_CLUSTER_POLL_S: "30"
      D2_MAX_CONCURRENT: "3"
      D2_FNG_SOFT_GATE: "log_only"
    command: ["python", "-u", "d2_paper_trader.py"]
    mem_limit: 1g
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  expired_opp_exit_settler:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: expired_opp_exit_settler
      SETTLER_INTERVAL_S: "3600"
    command: ["python", "-u", "/scripts/expired_opportunity_exit_settler.py", "--loop", "--interval-seconds", "3600", "--limit", "5000"]
    volumes:
      - ./scripts:/scripts
    mem_limit: 1g
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:
  social_telegram_sessions:

networks:
  backend:
