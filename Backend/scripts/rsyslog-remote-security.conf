# MCAS Security Log Forwarding — SolarWinds TLS
$DefaultNetstreamDriverCAFile /etc/ssl/certs/ca-certificates.crt
$DefaultNetstreamDriver gtls

template(name="SWtoken" type="string"
    string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %APP-NAME% %PROCID% %MSGID% [JBye0WyspW0wLMJryD7iyKW7rVVeKvPpAPB7fGAUrdUSnCt_fHyklZASgGc2AEgX8UtFA28@41058] %msg%\n"
)

# Sudo commands
:programname, isequal, "sudo" action(type="omfwd" target="syslog.collector.eu-01.cloud.solarwinds.com" port="6514" protocol="tcp" StreamDriverMode="1" StreamDriverAuthMode="anon" template="SWtoken")

# SSH accepted logins only
:msg, contains, "Accepted publickey" action(type="omfwd" target="syslog.collector.eu-01.cloud.solarwinds.com" port="6514" protocol="tcp" StreamDriverMode="1" StreamDriverAuthMode="anon" template="SWtoken")
:msg, contains, "Accepted password" action(type="omfwd" target="syslog.collector.eu-01.cloud.solarwinds.com" port="6514" protocol="tcp" StreamDriverMode="1" StreamDriverAuthMode="anon" template="SWtoken")

# MCAS custom events (logger -t mcas-security "message")
:syslogtag, startswith, "mcas-security" action(type="omfwd" target="syslog.collector.eu-01.cloud.solarwinds.com" port="6514" protocol="tcp" StreamDriverMode="1" StreamDriverAuthMode="anon" template="SWtoken")
