<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" fill="none" role="img" aria-label="MCAS">
  <!-- Shield outline -->
  <path
    d="M32 2L6 14v22c0 16.6 11 31.2 26 34 15-2.8 26-17.4 26-34V14L32 2z"
    stroke="#e2e8f0"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="#0d1117"
  />

  <!-- 5 candlesticks forming M: green-red-green-red-green -->

  <!-- Candle 1 — GREEN (left leg of M, tall) -->
  <line x1="16" y1="20" x2="16" y2="52" stroke="#1D9E75" stroke-width="1.5" />
  <rect x="13" y="24" width="6" height="18" rx="1" fill="#1D9E75" />

  <!-- Candle 2 — RED (first valley) -->
  <line x1="24" y1="26" x2="24" y2="56" stroke="#E24B4A" stroke-width="1.5" />
  <rect x="21" y="34" width="6" height="16" rx="1" fill="#E24B4A" />

  <!-- Candle 3 — GREEN (center peak) -->
  <line x1="32" y1="18" x2="32" y2="50" stroke="#1D9E75" stroke-width="1.5" />
  <rect x="29" y="22" width="6" height="18" rx="1" fill="#1D9E75" />

  <!-- Candle 4 — RED (second valley) -->
  <line x1="40" y1="26" x2="40" y2="56" stroke="#E24B4A" stroke-width="1.5" />
  <rect x="37" y="34" width="6" height="16" rx="1" fill="#E24B4A" />

  <!-- Candle 5 — GREEN (right leg of M, tall) -->
  <line x1="48" y1="20" x2="48" y2="52" stroke="#1D9E75" stroke-width="1.5" />
  <rect x="45" y="24" width="6" height="18" rx="1" fill="#1D9E75" />
</svg>
