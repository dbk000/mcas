# Sponsor URL templates — Phase 0 Holdings_Feed_URL construction.
#
# For each known sponsor, lists up to N candidate URL patterns that expose
# (a) the fund's public landing page (for sponsor_page_url) and (b) the
# daily holdings feed (the file Phase 4 would ingest). metadata_enrich.py
# substitutes {TICKER} / {ticker_lower} and HEAD-checks each pattern until
# one returns 200 or 302. Templates are ordered most-specific first.
#
# Fields per sponsor:
#   fund_page       — list of URL templates for the sponsor's fund landing page
#   holdings_feed   — list of URL templates for the daily holdings file
#   holdings_format — expected format of the first successful holdings URL
#                     (csv / xlsx / json / html_table / pdf / other)
#   notes           — human-readable gotchas / ambiguities
#
# Placeholders:
#   {TICKER}        — uppercase raw ticker (BRK.B etc.)
#   {ticker_lower}  — lowercase raw ticker
#   {TICKER_CLEAN}  — uppercase with dots/special chars stripped (BRK.B -> BRKB)
#   {ticker_clean_lower} — lowercase + cleaned
#
# Governance: additions require a commit message prefix
# "registry: sponsor templates {sponsor_slug} ...".

version: 1
frozen_at: 2026-04-22

templates:

  ishares:
    fund_page:
      - "https://www.ishares.com/us/products/search?filter=ticker:{TICKER}"
    holdings_feed:
      - "https://www.ishares.com/us/products/search?style=etf&filter=ticker:{TICKER}"
    holdings_format: xlsx
    notes: |
      iShares real holdings URLs require product_id lookup. The search page
      reliably redirects to the fund page and exposes a "Download holdings"
      button. Phase 4 will parse the fund page for the per-fund product_id
      to hit the AJAX endpoint. For Phase 0 we only need a verified URL
      that the enrichment HEAD-check can reach — the search URL meets
      that bar.

  vanguard:
    fund_page:
      - "https://investor.vanguard.com/investment-products/etfs/profile/{ticker_lower}"
    holdings_feed:
      - "https://investor.vanguard.com/investment-products/etfs/profile/{ticker_lower}"
    holdings_format: html_table
    notes: |
      Vanguard exposes holdings through their profile page. The "portfolio"
      tab lists top holdings; full CSV is available via their advisor portal
      which requires sign-in. Phase 4 will use the public profile page.

  state_street:
    fund_page:
      - "https://www.ssga.com/us/en/intermediary/etfs/{TICKER}"
    holdings_feed:
      - "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-{TICKER}.xlsx"
      - "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-{ticker_lower}.xlsx"
    holdings_format: xlsx
    notes: |
      SSGA SPDR daily holdings follow a canonical naming pattern on their
      CDN. Some funds (e.g. legacy NYSE SPDR) may use a different path —
      fall back to the fund page and let Phase 4 scrape.

  invesco:
    fund_page:
      - "https://www.invesco.com/us/financial-products/etfs/product-detail?audienceType=Investor&ticker={TICKER}"
    holdings_feed:
